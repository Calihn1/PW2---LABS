{% extends 'baseUser.html' %}

{% block title %}Registrarse - Travello{% endblock %}
{% block heading %}Únete a Travello{% endblock %}

{% block content %}
<form action="{% url 'register' %}" method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="first_name" class="form-label">Nombre</label>
        <input type="text" name="first_name" id="first_name" class="form-control" placeholder="Nombre" required>
    </div>
    <div class="mb-3">
        <label for="last_name" class="form-label">Apellido</label>
        <input type="text" name="last_name" id="last_name" class="form-control" placeholder="Apellido" required>
    </div>
    <div class="mb-3">
        <label for="username" class="form-label">Nombre de usuario</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Nombre de usuario" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="Correo electrónico" required>
    </div>
    <div class="mb-3">
        <label for="password1" class="form-label">Contraseña</label>
        <input type="password" name="password1" id="password1" class="form-control" placeholder="Contraseña" required>
    </div>
    <div class="mb-3">
        <label for="password2" class="form-label">Confirmar contraseña</label>
        <input type="password" name="password2" id="password2" class="form-control" placeholder="Confirmar contraseña" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Registrarse</button>
</form>
<p class="mt-3 text-center">
    ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
</p>
{% endblock %}
